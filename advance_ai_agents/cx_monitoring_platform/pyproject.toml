[project]
name = "cx-monitoring-platform"
version = "0.1.0"
description = "Pro-active CX Monitoring Platform - Engine 1: SLA Library and Rules Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.32.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "agno>=1.8.1",
    "openai>=1.106.1",
    "streamlit>=1.49.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine1"]
